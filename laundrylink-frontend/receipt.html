<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receipt Print</title>
  <style>
    /* Thermal paper styling (standard 58mm / 80mm roll width print layout) */
    @media print {
      body {
        width: 80mm;
        margin: 0;
        padding: 0;
      }
      .no-print {
        display: none;
      }
    }
    
    body {
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      line-height: 1.35;
      color: #000;
      background: #fff;
      padding: 10px;
      max-width: 300px;
      margin: 0 auto;
    }
    
    .divider {
      border-top: 1px dashed #000;
      margin: 8px 0;
    }
    
    .text-center {
      text-align: center;
    }
    
    .text-right {
      text-align: right;
    }
    
    .header {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 4px;
    }
    
    .row {
      display: flex;
      justify-content: space-between;
    }
    
    .receipt-title {
      font-weight: bold;
      font-size: 13px;
      margin: 6px 0;
    }
    
    .btn-container {
      margin-top: 20px;
      text-align: center;
    }
    
    .btn-print {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      font-weight: bold;
      padding: 8px 16px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="receipt-content">
    <div class="text-center">Loading receipt data...</div>
  </div>

  <div class="btn-container no-print">
    <button class="btn-print" onclick="window.print()">Print Receipt</button>
  </div>

  <script src="config.js"></script>
  <script>
    // Parse order ID from URL query parameters
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get("order_id");

    async function fetchReceiptData() {
      const container = document.getElementById("receipt-content");
      if (!orderId) {
        container.innerHTML = `<div class="text-center">Error: Missing order_id parameter</div>`;
        return;
      }

      try {
        // Fetch active/open job orders to find our matching record
        const res = await fetch(`${CONFIG.PI_BASE_URL}/dashboard/job-orders/open`);
        const data = await res.json();
        const orders = data.job_orders || [];
        const order = orders.find(o => o.id === orderId);

        if (!order) {
          container.innerHTML = `
            <div class="text-center">
              <h3>Receipt Printed</h3>
              <p>Job order is either finalized or offline.</p>
              <div class="divider"></div>
              <p>Ref: ${orderId.substring(0,8)}</p>
            </div>
          `;
          return;
        }

        renderReceipt(order);
        
        // Auto print after rendering
        setTimeout(() => {
          window.print();
        }, 500);

      } catch (err) {
        container.innerHTML = `<div class="text-center">Failed to fetch print template. Check server connection.</div>`;
      }
    }

    function renderReceipt(order) {
      const container = document.getElementById("receipt-content");
      const shopName = CONFIG.SHOP_NAME || "LaundryLink";
      
      const washQty = parseInt(order.wash_qty || 0);
      const dryQty = parseInt(order.dry_qty || 0);
      const pAmt = parseFloat(order.product_amount || 0);
      const sAmt = parseFloat(order.service_amount || 0);
      
      const washUnitPrice = parseFloat(order.wash_unit_price || 60);
      const dryUnitPrice = parseFloat(order.dry_unit_price || 60);
      
      const washTotal = washQty * washUnitPrice;
      const dryTotal = dryQty * dryUnitPrice;
      const totalAmount = parseFloat(order.total_amount || 0);
      
      const dateStr = order.created_at ? order.created_at.substring(0, 16) : new Date().toLocaleString();

      let itemLines = '';
      if (washQty > 0) {
        itemLines += `
          <div class="row">
            <span>Wash Cycle x${washQty}</span>
            <span>₱${washTotal.toFixed(2)}</span>
          </div>
        `;
      }
      if (dryQty > 0) {
        itemLines += `
          <div class="row">
            <span>Dry Cycle x${dryQty}</span>
            <span>₱${dryTotal.toFixed(2)}</span>
          </div>
        `;
      }
      if (pAmt > 0) {
        itemLines += `
          <div class="row">
            <span>Product Add-ons</span>
            <span>₱${pAmt.toFixed(2)}</span>
          </div>
        `;
      }
      if (sAmt > 0) {
        itemLines += `
          <div class="row">
            <span>Service Add-ons</span>
            <span>₱${sAmt.toFixed(2)}</span>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="text-center header">${shopName}</div>
        <div class="text-center">JOB ORDER SLIP</div>
        <div class="divider"></div>
        
        <div class="row">
          <span>JO Number:</span>
          <span style="font-weight: bold;">JO-${order.job_order_no || 'N/A'}</span>
        </div>
        <div class="row">
          <span>Date:</span>
          <span>${dateStr}</span>
        </div>
        
        <div class="divider"></div>
        
        <div class="row" style="font-weight: bold;">
          <span>Customer:</span>
          <span>${order.customer_name}</span>
        </div>
        <div class="row">
          <span>Phone:</span>
          <span>${order.customer_phone || 'No Phone'}</span>
        </div>
        
        <div class="divider"></div>
        <div class="receipt-title text-center">ORDER ITEMS</div>
        
        ${itemLines}
        
        <div class="divider"></div>
        
        <div class="row">
          <span>Payment Mode:</span>
          <span>${order.paid_by_gcash ? 'GCash' : 'Cash'}</span>
        </div>
        <div class="row" style="font-weight: bold; font-size: 13px;">
          <span>TOTAL AMOUNT:</span>
          <span>₱${totalAmount.toFixed(2)}</span>
        </div>
        
        <div class="divider"></div>
        <div class="text-center" style="font-size: 11px; margin-top: 10px;">
          Thank you for choosing ${shopName}!<br>
          Please keep this slip as reference.
        </div>
      `;
    }

    // Initialize
    fetchReceiptData();
  </script>
</body>
</html>
