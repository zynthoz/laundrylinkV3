<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>LaundryLink</title>
  <!-- Modern clean typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
  <script src="config.js?v=2"></script>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          <path d="M2 12h20"></path>
        </svg>
      </div>
      <h1 class="shop-name" id="shop-name">LaundryLink</h1>
    </div>
    <div class="top-bar-center">
      <div class="shift-indicator" id="shift-indicator">
        <span class="indicator-dot"></span>
        <span class="indicator-text">Loading...</span>
      </div>
    </div>
    <div class="top-bar-right">
      <div class="top-bar-time" id="top-bar-time">--:-- --</div>
    </div>
  </header>

  <!-- NOTIFICATION CONTAINER -->
  <div id="notification-container" class="notification-container"></div>

  <!-- MAIN PAGE CONTENT -->
  <main class="content" id="content">
    <div class="initial-loader">
      <div class="spinner"></div>
      <p>Starting LaundryLink...</p>
    </div>
  </main>

  <!-- BOTTOM TABS -->
  <nav class="bottom-nav">
    <button class="tab-btn active" id="tab-machines" onclick="showTab('machines')">
      <svg class="tab-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <!-- Washer visual -->
        <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
        <circle cx="12" cy="12" r="5"></circle>
        <circle cx="12" cy="12" r="2"></circle>
        <line x1="8" y1="5" x2="10" y2="5"></line>
        <line x1="14" y1="5" x2="16" y2="5"></line>
      </svg>
      <span>Machines</span>
    </button>
    <button class="tab-btn" id="tab-orders" onclick="showTab('orders')">
      <svg class="tab-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <!-- Orders visual -->
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        <line x1="9" y1="12" x2="15" y2="12"></line>
        <line x1="9" y1="16" x2="13" y2="16"></line>
      </svg>
      <span>Orders</span>
    </button>
    <button class="tab-btn" id="tab-reports" onclick="showTab('reports')">
      <svg class="tab-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <!-- Chart visual -->
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>Reports</span>
    </button>
    <button class="tab-btn" id="tab-more" onclick="showTab('more')">
      <svg class="tab-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <!-- More visual -->
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>More</span>
    </button>
  </nav>

  <!-- Core and page scripts -->
  <script src="app.js"></script>
  <script src="pages/machines.js"></script>
  <script src="pages/orders.js"></script>
  <script src="pages/reports.js"></script>
  <script src="pages/more.js"></script>
</body>
</html>
